name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs to write (posting a PR comment,
# for example) declares its own `permissions:`, which replaces this one for
# that job rather than adding to it.
permissions:
  contents: read

jobs:
  verify:
    name: Build & test (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ubuntu-latest ships a Docker daemon, so the Testcontainers-based
      # integration tests (PayoutApiIT, real PostgreSQL 16) actually run here
      # instead of being skipped as they are on Docker-less machines.
      - name: Build and run unit + integration tests
        run: ./mvnw -B verify
